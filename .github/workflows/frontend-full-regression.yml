name: Frontend Full Regression

on:
  push:
    branches:
      - dev
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-full-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
  NEXT_PUBLIC_AZURE_CLIENT_ID: ci-frontend-client-id
  NEXT_PUBLIC_AZURE_TENANT_ID: common
  NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000
  SECURITY_AUDIT_FAIL_LEVEL: high
  LIGHTHOUSE_FORCE_SINGLE_WORKER: "1"

jobs:
  ui-regression:
    name: 1) UI Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full browser regression
        run: npm run test:e2e:full

      - name: Upload Playwright regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-regression-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  lighthouse-full:
    name: 2) Lighthouse Full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build frontend once for Lighthouse
        run: npm run build

      - name: Run full Lighthouse audits
        env:
          LIGHTHOUSE_SKIP_BUILD: "1"
        run: npm run test:lighthouse:full

      - name: Upload Lighthouse full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-full-reports
          path: tests/lighthouse/**/.reports/**
          if-no-files-found: warn

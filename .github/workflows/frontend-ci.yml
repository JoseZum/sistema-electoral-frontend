name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
  NEXT_PUBLIC_AZURE_CLIENT_ID: ci-frontend-client-id
  NEXT_PUBLIC_AZURE_TENANT_ID: common
  NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000
  SECURITY_AUDIT_FAIL_LEVEL: high
  LIGHTHOUSE_FORCE_SINGLE_WORKER: "1"

jobs:
  branch-policy:
    name: 0) Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Allow only dev pull requests into main
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.base_ref }}" = "main" ] \
            && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main only accepts pull requests coming from dev."
            exit 1
          fi

  static-checks:
    name: 1) Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: branch-policy
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: |
          npm run lint:ci
          npm run typecheck:ci
          npm run build

  unit-tests:
    name: 2) Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-checks
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:ci

  integration-tests:
    name: 3) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit-tests
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full browser integration suite
        run: npm run test:e2e:full

      - name: Upload Playwright integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  security-audit:
    name: 4) Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: integration-tests
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vulnerability audit
        run: npm run test:security

  lighthouse-audits:
    name: 5) Lighthouse Audits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: security-audit
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build frontend once for Lighthouse
        run: npm run build

      - name: Run full Lighthouse audits
        env:
          LIGHTHOUSE_SKIP_BUILD: "1"
        run: npm run test:lighthouse:full

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/lighthouse/**/.reports/**
          if-no-files-found: warn

  promote-dev-to-main:
    name: 6) Promote Dev To Main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lighthouse-audits
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to the tested dev commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev

          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has commits that are not in dev. Sync dev with main before promoting."
            exit 1
          fi

          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "main is already aligned with the tested dev commit."
            exit 0
          fi

          git push origin "$GITHUB_SHA:refs/heads/main"

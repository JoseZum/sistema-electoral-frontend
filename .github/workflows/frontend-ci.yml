name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_AZURE_CLIENT_ID: ci-frontend-client-id
  NEXT_PUBLIC_AZURE_TENANT_ID: common
  NEXT_PUBLIC_REDIRECT_URI: http://localhost:3000
  SECURITY_AUDIT_FAIL_LEVEL: high
  LIGHTHOUSE_FORCE_SINGLE_WORKER: "1"

jobs:
  branch-policy:
    name: 0) Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Allow only dev pull requests into main
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.base_ref }}" = "main" ] \
            && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main only accepts pull requests coming from dev."
            exit 1
          fi

  static-checks:
    name: 1) Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: branch-policy
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: |
          npm run lint:ci
          npm run typecheck:ci
          npm run build

  unit-tests:
    name: 2) Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-checks
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:ci

  integration-tests:
    name: 3) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit-tests
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full browser integration suite
        run: npm run test:e2e:full

      - name: Upload Playwright integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  security-audit:
    name: 4) Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: integration-tests
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vulnerability audit
        run: npm run test:security

  lighthouse-audits:
    name: 5) Lighthouse Audits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: security-audit
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build frontend once for Lighthouse
        run: npm run build

      - name: Run full Lighthouse audits
        env:
          LIGHTHOUSE_SKIP_BUILD: "1"
        run: npm run test:lighthouse:full

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/lighthouse/**/.reports/**
          if-no-files-found: warn

  system-e2e-tests:
    name: 6) System E2E (Backend-owned suite)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: lighthouse-audits
    env:
      AZURE_CLIENT_ID: aa4e880b-a43f-49d9-b0f2-98bbd86f2dec
      AZURE_TENANT_ID: common
      JWT_SECRET: ci_jwt_secret_change_in_prod
      VOTE_TOKEN_SECRET: ci_vote_token_secret_change_in_prod
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://tee_admin:tee_local_password@localhost:5432/tee_voting
      E2E_DATABASE_URL: postgresql://tee_admin:tee_local_password@localhost:5432/tee_voting
      E2E_BACKEND_URL: http://localhost:3001
      E2E_FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout backend E2E suite
        uses: actions/checkout@v4
        with:
          repository: JoseZum/sistema-electoral-backend
          ref: main
          path: sistema-electoral-backend
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frontend commit under test
        uses: actions/checkout@v4
        with:
          path: sistema-electoral-backend/sistema-electoral-frontend
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sistema-electoral-backend/package-lock.json

      - name: Install backend E2E dependencies
        working-directory: sistema-electoral-backend
        run: npm ci

      - name: Install Playwright browser
        working-directory: sistema-electoral-backend
        run: npx playwright install --with-deps chromium

      - name: Run backend-owned system E2E suite against this frontend commit
        working-directory: sistema-electoral-backend
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml logs > e2e-docker.log 2>&1 || true
            docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml down -v --remove-orphans
          }
          trap cleanup EXIT

          docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml up --build -d postgres backend frontend

          ensure_service_running() {
            local service="$1"
            local container_id
            local status

            container_id="$(docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "$service container was not created"
              docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml ps
              exit 1
            fi

            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              echo "$service container stopped before becoming ready"
              docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml logs "$service"
              exit 1
            fi
          }

          for url in "$E2E_BACKEND_URL/api/health" "$E2E_FRONTEND_URL"; do
            for attempt in {1..120}; do
              if curl -fs "$url" >/dev/null 2>&1; then
                break
              fi

              if [ "$url" = "$E2E_BACKEND_URL/api/health" ]; then
                ensure_service_running backend
              else
                ensure_service_running frontend
              fi

              if [ "$attempt" -eq 120 ]; then
                echo "Timed out waiting for $url"
                docker compose -p tee-frontend-e2e-ci -f docker-compose.e2e.yml logs
                exit 1
              fi

              sleep 2
            done
          done

          npx playwright test --config=playwright.config.ts

      - name: Upload system E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-system-e2e-artifacts
          path: |
            sistema-electoral-backend/playwright-report/
            sistema-electoral-backend/test-results/
            sistema-electoral-backend/e2e-docker.log
          if-no-files-found: warn

  promote-dev-to-main:
    name: 7) Promote Dev To Main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: system-e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fast-forward main to the tested dev commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev

          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has commits that are not in dev. Sync dev with main before promoting."
            exit 1
          fi

          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "main is already aligned with the tested dev commit."
            exit 0
          fi

          git push origin "$GITHUB_SHA:refs/heads/main"
